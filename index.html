<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6c5ce7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pitch Anything">
    <meta name="description" content="Oren Klaff ka revolutionary method — presenting, persuading, aur deal jeetne ka interactive deep-dive.">
    <title>Pitch Anything — Interactive Mastery</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ========== SPLASH SCREEN ========== -->
    <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-icon-wrap">
                <div class="splash-ring"></div>
                <i class="fas fa-rocket splash-icon"></i>
            </div>
            <h1 class="splash-title">Pitch Anything</h1>
            <p class="splash-author">by Oren Klaff</p>
            <div class="splash-tagline">Presenting, Persuading, aur Deal Jeetne Ka Ek Innovative Method</div>
            <div class="splash-features">
                <div class="splash-feat"><i class="fas fa-brain"></i><span>Deep Concepts</span></div>
                <div class="splash-feat"><i class="fas fa-hand-pointer"></i><span>Interactive</span></div>
                <div class="splash-feat"><i class="fas fa-check-double"></i><span>Step by Step</span></div>
                <div class="splash-feat"><i class="fas fa-trophy"></i><span>Quizzes</span></div>
            </div>
            <button id="startLearningBtn" class="btn-start">
                <span>Seekhna Shuru Karo</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- ========== MAIN APP ========== -->
    <div id="app" class="app hidden">

        <!-- Mobile Header -->
        <div class="mobile-header">
            <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">
                <i class="fas fa-bars"></i>
            </button>
            <h2 class="mobile-title">Pitch Anything</h2>
            <div id="mobileProgress" class="mobile-progress-badge">0%</div>
        </div>

        <!-- Sidebar Overlay (mobile) -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="book-icon-wrap">
                    <i class="fas fa-book"></i>
                </div>
                <div>
                    <h2 class="sidebar-title">Pitch Anything</h2>
                    <p class="sidebar-author">Oren Klaff</p>
                </div>
            </div>

            <div class="progress-block">
                <div class="progress-label">
                    <span>Overall Progress</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-track">
                    <div id="progressFill" class="progress-fill" style="width:0%"></div>
                </div>
                <div id="progressDetail" class="progress-detail">0 / 8 chapters complete</div>
            </div>

            <nav id="chapterNav" class="chapter-nav">
                <!-- rendered by JS -->
            </nav>

            <div class="sidebar-footer">
                <button id="resetProgressBtn" class="btn-reset" title="Saara progress reset karo">
                    <i class="fas fa-redo-alt"></i>
                    <span>Progress Reset Karo</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main id="mainContent" class="main-content">
            <!-- rendered by JS -->
        </main>

    </div>

    <!-- Toast container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Confetti canvas -->
    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

    <script src="js/app.js"></script>
    <script>
        // Register Service Worker for PWA / offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .then(function(reg) { console.log('[PWA] SW registered:', reg.scope); })
                    .catch(function(err) { console.warn('[PWA] SW registration failed:', err); });
            });
        }
    </script>
</body>
</html>
